services:
  backend:
    build:
      dockerfile: Dockerfile
      context: ./
    image: node:alpine
    env_file:
      - .env
    environment:
      PORT: ${PORT}
    ports:
      - "5000:5000"

  db_auc:
    image: postgres:latest
    environment:
      POSTGRES_USER: auc
      POSTGRES_DB: aucdb
      POSTGRES_PASSWORD: aucer
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  volumes:
    data: