stages:
  - build
  - deploy

variables:
  CI_REGISTRY: "registry.gitlab.com"
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/${CI_PROJECT_PATH}"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  GIT_STRATEGY: clone

.pre:
  stage: prepare
  tags:
    - auc
  image: alpine:latest
  script:
    - apk add --no-cache protobuf protobuf-dev
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n gitlab-ci-token:${CI_JOB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts
  artifacts:
    paths:
      - /kaniko/.docker/config.json
    expire_in: 1 hour

build:
  stage: build
  tags:
    - auc
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
    GODEBUG: "http2client=0"
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"
deploy:
  tags:
    - deploy
  stage: deploy
  image: docker:24.0
  variables:
    GODEBUG: "http2client=0"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@62.109.30.145 << EOF
      docker login -u "$CI_DEPLOY_USERNAME" -p "$CI_DEPLOY_PASSWORD" registry.gitlab.com || {
        echo "ERROR: Docker login failed";
        exit 1;
      }
      docker pull ${CI_REGISTRY_IMAGE}:latest
      cd ../lootor
      
      docker network rm lootor_network || true
      docker network create lootor_network || true
      
      docker-compose -f docker-compose.backend.yml down
      
      docker-compose -f docker-compose.backend.yml pull
      
      docker-compose -f docker-compose.backend.yml up -d auc redis elasticsearch news
      
      for i in {1..10}; do
        if docker exec lootor_auc pg_isready -U auc -d lootor; then
          break
        fi
        sleep 5
      done
      
      docker-compose -f docker-compose.backend.yml up -d backend1 backend2 backend3 backend4
      
      for i in {1..10}; do
        if docker exec lootor_backend1 curl -f http://localhost:5111/health; then
          break
        fi
        sleep 3
      done
      
      for attempt in {1..5}; do
        echo "Attempt $attempt to start nginx"
        docker-compose -f docker-compose.backend.yml up -d nginx
        sleep 10  # Даем время на старт
      
        if docker ps --filter "name=lootor_nginx" --format "{{.Status}}" | grep -q "Up"; then
          echo "Nginx is up and running"
          break
        else
          echo "Nginx failed to start, retrying..."
          docker-compose -f docker-compose.backend.yml stop nginx || true
        fi
      done
      
      docker-compose -f docker-compose.backend.yml ps
      docker logs lootor_backend1 --tail 50
      docker logs lootor_auc --tail 20
      docker logs lootor_nginx --tail 20 || true
      docker image prune -f
      docker builder prune --all --force
      docker image prune -a --force
      docker volume prune --force
      exit
      EOF