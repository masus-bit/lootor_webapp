syntax = "proto3";

import "google/protobuf/struct.proto";

package tags;

option go_package = "./gen/go/microservices";

service TagsService {
  rpc CreateTags(CreateTagsRequest) returns (TagsCreateResponse);
  rpc SearchTags(TagsSearchRequest) returns (TagsDataResponse);
  rpc MergeTags(MergeTagsRequest) returns (TagsSuccessResponse);
  rpc FindAllEntitiesByTag(GetEntitiesByTagRequest) returns (TagDataResponse);
  rpc AddTagToEntity(AddTagsToEntityRequest) returns (TagsSuccessResponse);
  rpc RemoveTagsFromEntity(RemoveTagsRequest) returns (TagsSuccessResponse);
  rpc UpdateTag(UpdateTagRequest) returns (TagItem);
  rpc GetAllTags(GetAllTagsRequest) returns (TagsDataResponse);
  rpc GetTagsByEntityId(GetTagsByEntityIdRequest) returns (GetShortsResponse);
  rpc AddTagsToEntity(AddFewTagsToEntityRequest) returns (GetShortsResponse);
  rpc GetTagsByEntityIdsMap(GetTagsByEntityIdsMapRequest) returns (TagsMapResponse);
  rpc UpdateTagsOfEntity(UpdateTagsOfEntityRequest) returns (TagsCreateResponse);
  rpc GetTagBySlug(GetTagBySlugRequest) returns (TagItem);
  rpc GetTag(GetTagRequest) returns (TagItemShort);
  rpc GetTagsByIDs(GetTagsByIDsRequest) returns (GetShortsResponse);
  rpc GetTagsByIdsMap(GetTagsByIDsRequest) returns (TagsMapResponseForEvents);
  rpc FindAllTags(FindAllTagsRequest) returns (TagsDataResponse);
  rpc MergeSeries(MergeTagsRequest) returns (TagsSuccessResponse);
  rpc SearchGameTitles(SearchGameTitlesRequest) returns (GameSearchResponse);
  rpc RecordUserChoice(RecordUserChoiceRequest) returns (TagsSuccessResponse);
  rpc GetSearchSuggestions(GetSearchSuggestionsRequest) returns (SearchSuggestionsResponse);
  rpc GetLearningStats(GetLearningStatsRequest) returns (LearningStatsResponse);
  rpc UpdateVisibleLinks(UpdateVisibleLinksRequest) returns (TagsSuccessResponse);
  rpc RemoveEntityTags(RemoveEntityTagsRequest) returns (TagsSuccessResponse);
  rpc DeleteTags(GetTagsByIDsRequest) returns (TagsSuccessResponse);
  rpc GetTagsTotalByUser(GetTagsTotalByUserRequest) returns (TagsTotalByUserResponse);
  rpc PublicUpdateTag(PublicUpdateTagRequest) returns (PublicUpdateTagResponse);
  rpc MoveTagLinks(MoveTagLinksRequest) returns (MoveTagLinksResponse);
  rpc GetOnModerationTags(OnModerationTagsRequest) returns (OnModerationTagsResponse);
}

message OnModerationTagsRequest {
  int64 limit = 1;
  int64 offset = 2;
}

message OnModerationTagsResponse {
  repeated TagItem tags = 1;
  int64 total = 2;
}

message MoveTagLinksRequest {
  string source_id = 1;
  string target_id = 2;
}

message MoveTagLinksResponse {
  bool success = 1;
}

message PublicUpdateTagRequest {
  string id = 1;
  google.protobuf.Struct additional_fields = 2;
}

message PublicUpdateTagResponse {
  TagItem tag = 1;
}

message GetTagsTotalByUserRequest {
  string user_login = 1;
}

message TagsTotalByUserResponse {
  int64 total_tags = 1;
}

message RemoveEntityTagsRequest {
  string entity_id = 1;
}

message UpdateVisibleLinksRequest {
  repeated string entity_ids = 1;
  bool visible = 2;
}

message SearchGameTitlesRequest {
  string query = 1;           // Search query (e.g., "metal gear solid 5 phantom pain")
  int32 limit = 2;           // Maximum number of results (default: 10)
  string session_id = 3;     // User session ID for learning
  string context_type = 4;   // Optional context (e.g., "game", "console", "comic")
}

message RecordUserChoiceRequest {
  string search_query = 1;   // Original search query
  string selected_tag_id = 2; // ID of the tag user selected
  string session_id = 3;     // User session ID
  string user_id = 4;        // Optional user ID
  bool was_correct = 5;      // Whether the result was correct
  int32 feedback_score = 6;  // -1, 0, 1 rating
}

message GetSearchSuggestionsRequest {
  string query = 1;          // Partial query for autocomplete
  int32 limit = 2;           // Maximum number of suggestions (default: 5)
}

message GetLearningStatsRequest {
  int32 days = 1;            // Number of days for statistics (default: 30)
}

// ===== RESPONSE MESSAGES =====

message GameSearchResponse {
  string search_term = 1;
  ParsedTitle parsed_title = 2;
  repeated SearchResult results = 3;
  int32 total_count = 4;
  int64 search_time_ns = 5;  // Search duration in nanoseconds
  bool did_learn = 6;        // Whether learning occurred
  repeated string suggestions = 7;
}

message SearchSuggestionsResponse {
  repeated SearchSuggestion suggestions = 1;
}

message LearningStatsResponse {
  int64 total_searches = 1;
  double avg_confidence = 2;
  int64 correct_searches = 3;
  double success_rate = 4;
}

// ===== DATA MESSAGES =====

message ParsedTitle {
  string original = 1;
  string series_core = 2;
  string game_part = 3;
  string edition = 4;
  string platform = 5;
  string year = 6;
  double confidence = 7;
}

message SearchResult {
  TagItem tag = 1;                   // Matched tag (if exact/partial match)
  TagItem series_tag = 2;            // Series tag (if series match)
  repeated TagItem series_entries = 3; // All entries in the series
  double confidence = 4;             // Match confidence (0.0 - 1.0)
  string match_type = 5;             // "exact", "series", "partial", "learned"
  double score = 6;                  // Final score for sorting
  ParsedTitle parsed_data = 7;       // Parsed title data
}

message SearchSuggestion {
  string title = 1;
  string type = 2;          // "series", "game", "platform", "learned"
  double confidence = 3;
  string tag_id = 4;        // Optional tag ID if applicable
  double score = 5;         // Sorting score
}

message FindAllTagsRequest {

}

message GetTagsByIDsRequest {
  repeated string ids = 1;
}

message UpdateTagsOfEntityRequest {
  repeated string tag_ids = 1;
  string entity_id = 2;
  string entity_type = 3;
  string author = 4;
}

message GetTagsByEntityIdsMapRequest {
  repeated string entity_ids = 1;
}

message TagsMapResponse {
  map<string, GetShortsResponse> tags = 1;
}
message TagsMapResponseForEvents {
  map<string, TagItemShort> tags = 1;
}

message AddFewTagsToEntityRequest {
  string entity_id = 1;
  repeated string tag_ids = 2;
  string entity_type = 3;
  string author = 4;
  bool show_search = 5;
}

message GetTagsByEntityIdRequest {
  string entity_id = 1;
}

message GetAllTagsRequest {
  int64 limit = 1;
  int64 offset = 2;
}

message GetTagRequest {
  string id = 1;
}

message GetTagBySlugRequest {
  string slug = 1;
}

message RemoveTagsRequest {
  string entity_id = 1;
  repeated string tag_ids = 2;
  string entity_type = 3;
}

message AddTagsToEntityRequest {
  string entity_id = 1;
  string tag_id = 2;
  string entity_type = 3;
}

message MergeTagsRequest {
  repeated string from_tag_ids = 1;
  string to_tag_id = 2;
}

message TagsSuccessResponse {
  bool success = 1;
}

message TagCreateResponse {
  string id = 1;
  string name = 2;
  string slug = 3;
  string primary_id = 4;
  string series_id = 5;
}

message TagsSearchRequest {
  string name = 1;
}

message TagsDataResponse {
  repeated TagItem tags = 1;
  int64 total = 2;
}

message TagDataResponse {
  TagItem tag = 1;
  int64 total_entities = 2;
  int64 total_posts = 3;
  int64 total_collections = 4;
  int64 total_collection_items = 5;
  map<string, GetShortsResponse> tags_map = 6;
  int64 total_photos = 7;
}

message CreateTagsRequest {
  repeated string names = 1;
  string author = 2;
}

message TagsCreateResponse {
  repeated TagCreateResponse tags = 1;
  int64 deleted_count = 2;
}

message TagItem {
  string id = 1;
  string name = 2;
  string slug = 3;
  string author = 4;
  string description = 5;
  string created_at = 6;
  string primary_id = 7;
  TagItem primary = 8;
  repeated TagLinksItem entities = 9;
  repeated TagItem synonyms = 10;
  bool is_primary = 11;
  string series_id = 12;
  bool is_series = 13;
  repeated TagItem series_entries = 14;
  TagItem series = 15;
  google.protobuf.Struct additional_fields = 16;
  int64 total_posts = 17;
  int64 total_collections = 18;
  int64 total_collection_items = 19;
  int64 total_photos = 20;
}

message GetShortsResponse {
  repeated TagItemShort tags = 1;
}

message TagItemShort {
  string id = 1;
  string name = 2;
  string slug = 3;
  string series_id = 4;
  string primary_id = 5;
}

message GetEntitiesByTagRequest {
  string tag_id = 1;
  string entity_type = 2;
  int64 limit = 3;
  int64 offset = 4;
  string author = 5;
}

message TagLinksItem {
  string tag_id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string created_at = 4;
}

message UpdateTagRequest {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  google.protobuf.Struct additional_fields = 5;
  bool on_moderation = 6;
}