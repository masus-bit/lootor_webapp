paths:
  /public/achievements:
    get:
      consumes:
      - application/json
      parameters:
      - description: login
        in: query
        name: login
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AchievementsResponse'
      summary: Получить все достижения юзера
      tags:
      - achievements
  /public/achievements/items:
