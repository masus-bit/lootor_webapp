image: docker:19-dind
services:
  - docker:19-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone
  DOCKER_DRIVER: overlay2

stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - auc
  before_script:
    - mkdir -p ~/.docker
    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts

  script:
    - echo -n $DOCKERHUB_PASSWORD | docker login docker.io --username $DOCKERHUB_LOGIN --password-stdin
    - docker build -t 5575123963/auc:latest -f Dockerfile .
    - docker push 5575123963/auc:latest

deploy:
  tags:
    - auc
  stage: deploy
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY_DEV}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@185.43.4.23 << EOF  # DEV хост
      cd ../lootor
      
      docker-compose -f docker-compose.backend.yml stop backend
      docker-compose -f docker-compose.backend.yml pull backend
      
      docker-compose -f docker-compose.backend.yml up -d backend
      
      for i in {1..15}; do
        if docker exec lootor_backend curl -fs http://localhost:5111/health >/dev/null; then
          echo "Backend is ready"
          break
        fi
        sleep 3
      done
      
      docker-compose -f docker-compose.backend.yml restart nginx
      
      docker logs lootor_backend --tail 50
      docker logs lootor_nginx --tail 20 || true
      
      docker image prune -f
      exit
      EOF

  only:
    - dev