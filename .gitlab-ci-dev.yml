stages:
  - build
  - deploy

variables:
  CI_REGISTRY: "registry.gitlab.com"
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/${CI_PROJECT_PATH}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone

.pre:
  stage: prepare
  tags:
    - auc
  image: alpine:latest
  script:
    - apk add --no-cache protobuf protobuf-dev
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n gitlab-ci-token:${CI_JOB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  artifacts:
    paths:
      - /kaniko/.docker/config.json
    expire_in: 1 hour

build:
  stage: build
  tags:
    - auc
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  script:
    - echo "Building backend image with tag ${IMAGE_TAG}"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"

  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY_DEV}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - |
      ssh -o StrictHostKeyChecking=no -t root@185.43.4.23 << 'EOF'
      set -e
      docker login -u "$CI_DEPLOY_USERNAME" -p "$CI_DEPLOY_PASSWORD" registry.gitlab.com

      export IMAGE_TAG=${CI_COMMIT_SHORT_SHA}
      cd ../lootor

      # Проверяем, есть ли backend сервис
      if docker service inspect lootor_backend >/dev/null 2>&1; then
          echo "Updating backend service..."
          docker service update --image registry.gitlab.com/auc2/backend_services/lootor_webapp:$IMAGE_TAG lootor_backend
      else
          echo "First deploy: deploying full stack..."
          docker network create -d overlay --attachable lootor_network || true
          docker volume create lootor_postgres_data || true
          docker volume create redis_data || true
          docker volume create elasticsearch_data || true
          docker volume create portainer_data || true
          docker swarm init --advertise-addr 185.43.4.23 || true
          docker stack deploy -c docker-compose.swarm.yml lootor
      fi

      # Проверка логов
      docker service logs lootor_backend --tail 50
      exit
      EOF
  only:
    - dev
