stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone
  DOCKER_DRIVER: overlay2

.pre:
  stage: prepare
  tags:
    - auc
  image: alpine:latest
  script:
    - apk add --no-cache protobuf protobuf-dev
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n "$DOCKERHUB_LOGIN:$DOCKERHUB_PASSWORD" | base64 -w 0)\"}}}" > /kaniko/.docker/config.json    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts
  artifacts:
    paths:
      - /kaniko/.docker/config.json
    expire_in: 1 hour

build:
  stage: build
  tags:
    - auc
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "docker.io/5575123963/auc:latest"
      --cache=true
      --cache-repo "docker.io/5575123963/auc-cache"

deploy:
  tags:
    - auc
  stage: deploy
  image: docker:24.0
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY_DEV}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@185.43.4.23 << EOF  # DEV хост
      cd ../lootor
      
      docker network rm lootor_network || true
      docker network create lootor_network || true
      
      if ! docker inspect -f '{{.State.Running}}' lootor_elasticsearch 2>/dev/null | grep -q "true"; then
        echo "Starting elasticsearch..."
        docker-compose -f docker-compose.backend.yml up -d elasticsearch
      fi
      
      if ! docker inspect -f '{{.State.Running}}' lootor_redis 2>/dev/null | grep -q "true"; then
        echo "Starting redis..."
        docker-compose -f docker-compose.backend.yml up -d redis
      fi
      
      if ! docker inspect -f '{{.State.Running}}' lootor_auc 2>/dev/null | grep -q "true"; then
        echo "Starting auc..."
        docker-compose -f docker-compose.backend.yml up -d auc
        for i in {1..10}; do
          if docker exec lootor_auc pg_isready -U auc -d lootor; then
            echo "AUC is ready"
            break
          fi
          sleep 5
        done
      fi
      
      docker-compose -f docker-compose.backend.yml stop backend
      docker-compose -f docker-compose.backend.yml pull backend
      docker-compose -f docker-compose.backend.yml up -d backend
      
      for i in {1..15}; do
        if docker exec lootor_backend curl -fs http://localhost:5111/health >/dev/null; then
          echo "Backend is ready"
          break
        fi
        sleep 3
      done
      
      docker-compose -f docker-compose.backend.yml restart nginx
      
      docker-compose -f docker-compose.backend.yml ps
      docker logs lootor_backend --tail 50
      docker logs lootor_nginx --tail 20 || true
      
      docker image prune -f
      docker builder prune --all --force
      docker image prune -a --force
      docker volume prune --force      
      exit
      EOF

  only:
    - dev