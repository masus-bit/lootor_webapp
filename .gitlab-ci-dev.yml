stages:
  - build
  - deploy

variables:
  CI_REGISTRY: "registry.gitlab.com"
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/${CI_PROJECT_PATH}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone

.pre:
  stage: prepare
  tags:
    - auc
  image: alpine:latest
  script:
    - apk add --no-cache protobuf protobuf-dev
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n gitlab-ci-token:${CI_JOB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  artifacts:
    paths:
      - /kaniko/.docker/config.json
    expire_in: 1 hour

build:
  stage: build
  tags:
    - auc
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  script:
    - echo "Building backend image with tag ${CI_COMMIT_SHORT_SHA}"
    - /kaniko/executor
      --context ${CI_PROJECT_DIR}
      --dockerfile ${CI_PROJECT_DIR}/Dockerfile
      --destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      --destination ${CI_REGISTRY_IMAGE}:latest
      --cache=true
      --cache-repo ${CI_REGISTRY_IMAGE}/cache

deploy:
  stage: deploy
  tags:
    - auc
  image: docker:24.0
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY_DEV}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - |
      ssh -o StrictHostKeyChecking=no -t root@185.43.4.23 << EOF
      set -e
      docker login -u "$CI_DEPLOY_USERNAME" -p "$CI_DEPLOY_PASSWORD" registry.gitlab.com

      export IMAGE_TAG=${CI_COMMIT_SHORT_SHA}

      # Переходим в папку проекта
      cd ../lootor

      # Обновляем только backend
      docker service update \
        --image registry.gitlab.com/auc2/backend_services/lootor_webapp:\$IMAGE_TAG \
        lootor_backend

      # Проверка логов
      docker service logs lootor_backend --tail 50

      exit
      EOF
  only:
    - dev
