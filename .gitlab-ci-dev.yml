image: docker:19-dind
services:
  - docker:19-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone
  DOCKER_DRIVER: overlay2

stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - dev  # Используем тег dev вместо auc
  before_script:
    - mkdir -p ~/.docker
    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts

  script:
    - echo -n $DOCKERHUB_PASSWORD | docker login docker.io --username $DOCKERHUB_LOGIN --password-stdin
    - docker build -t 5575123963/auc:latest -f Dockerfile .
    - docker push 5575123963/auc:latest

deploy:
  tags:
    - dev  # Используем тег dev вместо deploy
  stage: deploy
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY_DEV}" | tr -d '\r' | ssh-add -  # Используем DEV ключ
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@185.43.4.23 << EOF  # DEV хост
      cd ../lootor
      
      # Сеть (аналогично main)
      docker network rm lootor_network || true
      docker network create lootor_network || true
      
      # Остановка всех сервисов
      docker-compose -f docker-compose.backend.yml down
      
      # Пулл образов
      docker-compose -f docker-compose.backend.yml pull
      
      # Запуск зависимостей (аналогично main)
      docker-compose -f docker-compose.backend.yml up -d auc redis elasticsearch
      
      # Ожидание готовности Postgres (аналогично main)
      for i in {1..10}; do
        if docker exec lootor_auc pg_isready -U auc -d lootor; then
          break
        fi
        sleep 5
      done
      
      # Запуск ОДНОГО backend (вместо 4-х)
      docker-compose -f docker-compose.backend.yml up -d backend
      
      # Проверка healthcheck (адаптировано под один backend)
      for i in {1..10}; do
        if docker exec lootor_backend curl -f http://localhost:5111/health; then
          break
        fi
        sleep 3
      done
      
      # Запуск nginx (аналогично main)
      for attempt in {1..5}; do
        echo "Attempt $attempt to start nginx"
        docker-compose -f docker-compose.backend.yml up -d nginx
        sleep 10
      
        if docker ps --filter "name=lootor_nginx" --format "{{.Status}}" | grep -q "Up"; then
          echo "Nginx is up and running"
          break
        else
          echo "Nginx failed to start, retrying..."
          docker-compose -f docker-compose.backend.yml stop nginx || true
        fi
      done
      
      # Вывод статуса (адаптировано под один backend)
      docker-compose -f docker-compose.backend.yml ps
      docker logs lootor_backend --tail 50
      docker logs lootor_auc --tail 20
      docker logs lootor_nginx --tail 20 || true
      
      # Безопасная очистка (только неиспользуемые образы)
      docker image prune -f
      exit
      EOF

  only:
    - dev  # Запуск только для dev ветки