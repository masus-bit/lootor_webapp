stages:
  - security
  - build
  - deploy

variables:
  CI_REGISTRY: "registry.gitlab.com"
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/${CI_PROJECT_PATH}"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  GIT_STRATEGY: clone

.pre:
  stage: prepare
  tags:
    - auc
  image: alpine:latest
  script:
    - apk add --no-cache protobuf protobuf-dev
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n gitlab-ci-token:${CI_JOB_TOKEN} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts
  artifacts:
    paths:
      - /kaniko/.docker/config.json
    expire_in: 1 hour

sast_gosec:
  stage: security
  tags:
    - auc
  image: golang:1.24
  before_script:
    - cd $CI_PROJECT_DIR
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - |
      # Запускаем gosec и сохраняем вывод
      set +e
      OUTPUT=$($(go env GOPATH)/bin/gosec ./... 2>&1)
      set -e
      
      echo "=== FULL OUTPUT ==="
      echo "$OUTPUT"
      echo "=== END OUTPUT ==="
      
      if echo "$OUTPUT" | grep "Issues : 0" > /dev/null; then
        echo "✅ GOSEC CHECK PASSED (method 1)"
        exit 0
      elif echo "$OUTPUT" | grep -E "Issues:[[:space:]]*0" > /dev/null; then
        echo "✅ GOSEC CHECK PASSED (method 2)" 
        exit 0
      elif echo "$OUTPUT" | tail -10 | grep "Issues : 0" > /dev/null; then
        echo "✅ GOSEC CHECK PASSED (method 3)"
        exit 0
      else
        echo "❌ GOSEC CHECK FAILED"
        echo "Debug: Looking for 'Issues: 0' pattern..."
        echo "$OUTPUT" | grep -i "issues" || echo "No 'issues' found in output"
        exit 1
      fi
  allow_failure: false

build:
  stage: build
  tags:
    - auc
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
    GODEBUG: "http2client=0"
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/cache"

deploy:
  tags:
    - deploy
  stage: deploy
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY_DEV}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@185.43.4.23 << EOF
      docker login -u "$CI_DEPLOY_USERNAME" -p "$CI_DEPLOY_PASSWORD" registry.gitlab.com || {
        echo "ERROR: Docker login failed";
        exit 1;
      }
      
      docker pull registry.gitlab.com/auc2/backend_services/lootor_webapp:latest
      
      docker service update --force --image registry.gitlab.com/auc2/backend_services/lootor_webapp:latest lootor_backend      
      
      echo "Waiting for services to start..."
      sleep 10
      
      echo "=== Services status ==="
      docker service ls
      
      docker image prune -f
      docker builder prune --all --force
      docker image prune -a --force
      docker volume prune --force    
      docker container prune -f
      
      exit
      EOF
  only:
    - dev
