image: docker:24.0

services:
  - docker:24.0-dind

stages:
  - build
  - deploy

variables:
  CI_REGISTRY: "registry.gitlab.com"
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/${CI_PROJECT_PATH}"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: "1"

build:
  stage: build
  tags:
    - auc
  before_script:
    - mkdir -p /certs/client
    - echo "$DOCKER_TLS_CA_CERT" > /certs/client/ca.pem
    - echo "$DOCKER_TLS_CERT" > /certs/client/cert.pem
    - echo "$DOCKER_TLS_KEY" > /certs/client/key.pem
    - chmod 600 /certs/client/*
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t ${CI_REGISTRY_IMAGE}:latest \
      --cache-from ${CI_REGISTRY_IMAGE}:latest \
      .
    - docker push ${CI_REGISTRY_IMAGE}:latest

deploy:
  stage: deploy
  tags:
    - auc
  image: docker:24.0
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - 'command -v ssh-agent >/dev/null || (apk add --no-cache openssh-client)'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY_DEV}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      ssh -o StrictHostKeyChecking=no root@185.43.4.23 <<EOF
      docker login -u gitlab-ci-token -p $CI_DEPLOY_PASSWORD $CI_REGISTRY
      docker pull ${CI_REGISTRY_IMAGE}:latest
      cd ../lootor
      
      docker network rm lootor_network || true
      docker network create lootor_network || true
      
      if ! docker inspect -f '{{.State.Running}}' lootor_elasticsearch 2>/dev/null | grep -q "true"; then
        echo "Starting elasticsearch..."
        docker-compose -f docker-compose.backend.yml up -d elasticsearch
      fi
      
      if ! docker inspect -f '{{.State.Running}}' lootor_redis 2>/dev/null | grep -q "true"; then
        echo "Starting redis..."
        docker-compose -f docker-compose.backend.yml up -d redis
      fi
      
      if ! docker inspect -f '{{.State.Running}}' lootor_auc 2>/dev/null | grep -q "true"; then
        echo "Starting auc..."
        docker-compose -f docker-compose.backend.yml up -d auc
        for i in {1..10}; do
          if docker exec lootor_auc pg_isready -U auc -d lootor; then
            echo "AUC is ready"
            break
          fi
          sleep 5
        done
      fi
      
      docker-compose -f docker-compose.backend.yml stop backend
      docker-compose -f docker-compose.backend.yml pull backend
      docker-compose -f docker-compose.backend.yml up -d backend
      
      for i in {1..15}; do
        if docker exec lootor_backend curl -fs http://localhost:5111/health >/dev/null; then
          echo "Backend is ready"
          break
        fi
        sleep 3
      done
      
      docker-compose -f docker-compose.backend.yml restart nginx
      
      docker-compose -f docker-compose.backend.yml ps
      docker logs lootor_backend --tail 50
      docker logs lootor_nginx --tail 20 || true
      
      docker image prune -f
      docker builder prune --all --force
      docker image prune -a --force
      docker volume prune --force
      exit
      EOF
  only:
    - dev