image: docker:19-dind
services:
  - docker:19-dind

variables:
  # See https://github.com/docker-library/docker/pull/166
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone
  DOCKER_DRIVER: overlay2
# This folder is cached between builds
# https://docs.gitlab.com/ee/ci/yaml/index.html#cache
stages:
  - auc
  - deploy

build:
  stage: auc
  tags:
    - dev
  before_script:
    - mkdir -p ~/.docker
    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts

  script:
    - echo -n $DOCKERHUB_PASSWORD | docker login docker.io --username $DOCKERHUB_LOGIN --password-stdin
    - docker build -t 5575123963/auc:latest -f Dockerfile .
    - docker push 5575123963/auc:latest


deploy:
  tags:
    - dev
  stage: deploy
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@185.43.4.23 << EOF
      cd ../lootor
      ls
      docker network inspect lootor_network >/dev/null 2>&1 || docker network create lootor_network
      docker-compose -f docker-compose.backend.yml stop backend
      docker-compose -p lootor -f docker-compose.backend.yml rm -f backend
      docker rm -f lootor_backend_1 2>/dev/null || true
      docker network disconnect -f lootor_network lootor_backend_1 2>/dev/null || true
      docker-compose -p lootor -f docker-compose.backend.yml up -d --force-recreate backend
      docker system prune -f
      exit 
      EOF

  only:
    - dev

