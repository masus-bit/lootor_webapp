# Official framework image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/node/tags/

# Pick zero or more services to be used on all builds.
# Only needed when using a docker container to run your tests in.
# Check out: https://docs.gitlab.com/ee/ci/services/index.html
image: docker:19-dind
services:
  - docker:19-dind

variables:
  # See https://github.com/docker-library/docker/pull/166
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone
  DOCKER_DRIVER: overlay2

# This folder is cached between builds
# https://docs.gitlab.com/ee/ci/yaml/index.html#cache
stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - build
  before_script:
    - mkdir -p ~/.docker
    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts

  script:
    - echo -n $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_LOGIN --password-stdin $DOCKERHUB_PASSWORD
    - docker build -t 5575123963/auc:latest -f Dockerfile .
    - docker push 5575123963/auc:latest


deploy:
  tags:
    - deploy
  stage: deploy
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@134.0.115.88 << EOF
      cd /
      docker-compose down
      docker-compose up -d --force-recreate
      exit 
      EOF

  only:
    - develop

