image: docker:19-dind
services:
  - docker:19-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  GIT_STRATEGY: clone
  DOCKER_DRIVER: overlay2

stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - auc
  before_script:
    - mkdir -p ~/.docker
    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - echo "127.0.0.1 docker" > /etc/hosts

  script:
    - echo -n $DOCKERHUB_PASSWORD | docker login docker.io --username $DOCKERHUB_LOGIN --password-stdin
    - docker build -t 5575123963/auc:latest -f Dockerfile .
    - docker push 5575123963/auc:latest

deploy:
  tags:
    - deploy
  stage: deploy
  script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 600 ~/.ssh
    - echo "=================deploy to host================="
    - |
      ssh -o StrictHostKeyChecking=no -t -t root@62.109.30.145 << EOF
      cd ../lootor
      
      # Проверяем и создаем сеть если нужно
      docker network inspect lootor_network >/dev/null 2>&1 || docker network create lootor_network
      
      # Останавливаем и удаляем все бэкенды
      for i in {1..4}; do
        docker-compose -f docker-compose.backend.yml stop backend\$i || true
        docker-compose -f docker-compose.backend.yml rm -f backend\$i || true
        docker rm -f lootor_backend\$i\_1 2>/dev/null || true
        docker network disconnect -f lootor_network lootor_backend\$i\_1 2>/dev/null || true
      done
      
      # Подтягиваем новый образ
      docker-compose -f docker-compose.backend.yml pull
      
      # Запускаем только бэкенды
      docker-compose -f docker-compose.backend.yml up -d
      
      # Проверяем статус
      docker-compose -f docker-compose.backend.yml ps
      
      exit
      EOF

  only:
    - dev